name: Verify, Plan, Apply and Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.filter.outputs.infra }}
      app_changed: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infra/**'
            app:
              - 'src/**'
              - 'api/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.js'
              - 'scripts/**'
              - '.github/workflows/**'

  verify:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      id-token: write
      contents: read
    outputs:
      has_plan: ${{ steps.plan_meta.outputs.has_plan }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Build frontend
        run: npm run build

      - name: Validate required role configuration
        if: needs.changes.outputs.infra_changed == 'true'
        env:
          AWS_STATE_ROLE_ARN: ${{ secrets.AWS_STATE_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$AWS_STATE_ROLE_ARN" ]; then
            echo "Missing secret: AWS_STATE_ROLE_ARN"
            exit 1
          fi
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "Missing secret: AWS_DEPLOY_ROLE_ARN"
            exit 1
          fi

      - name: Configure AWS credentials for Terraform backend
        if: needs.changes.outputs.infra_changed == 'true'
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_STATE_ROLE_ARN }}
          role-session-name: gha-terraform-verify
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: Set up Terraform
        if: needs.changes.outputs.infra_changed == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Terraform fmt check
        if: needs.changes.outputs.infra_changed == 'true'
        working-directory: infra
        run: terraform fmt -check

      - name: Terraform init
        if: needs.changes.outputs.infra_changed == 'true'
        working-directory: infra
        run: terraform init -input=false

      - name: Configure AWS credentials for Terraform plan
        if: needs.changes.outputs.infra_changed == 'true'
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-terraform-plan
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: Terraform validate
        if: needs.changes.outputs.infra_changed == 'true'
        working-directory: infra
        run: terraform validate

      - name: Terraform plan
        if: needs.changes.outputs.infra_changed == 'true'
        working-directory: infra
        run: terraform plan -input=false -out=tfplan

      - name: Save plan metadata
        id: plan_meta
        run: |
          if [ "${{ needs.changes.outputs.infra_changed }}" = "true" ]; then
            echo "has_plan=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_plan=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Terraform plan artifact
        if: needs.changes.outputs.infra_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            infra/tfplan
            infra/.terraform.lock.hcl
          retention-days: 7

  infra_apply:
    runs-on: ubuntu-latest
    needs: [changes, verify]
    if: github.event_name != 'pull_request' && needs.verify.outputs.has_plan == 'true'
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
    outputs:
      bucket: ${{ steps.tf_outputs.outputs.BUCKET }}
      distribution_id: ${{ steps.tf_outputs.outputs.DISTRIBUTION_ID }}
      api_url: ${{ steps.tf_outputs.outputs.API_URL }}
      cognito_pool_id: ${{ steps.tf_outputs.outputs.COGNITO_POOL_ID }}
      cognito_client_id: ${{ steps.tf_outputs.outputs.COGNITO_CLIENT_ID }}
      cognito_domain: ${{ steps.tf_outputs.outputs.COGNITO_DOMAIN }}
      app_url: ${{ steps.tf_outputs.outputs.APP_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra

      - name: Configure AWS credentials for Terraform backend
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_STATE_ROLE_ARN }}
          role-session-name: gha-terraform-apply
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Configure AWS credentials for Terraform apply
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-terraform-apply-resources
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: Terraform apply saved plan
        working-directory: infra
        run: terraform apply -input=false tfplan

      - name: Read Terraform outputs
        working-directory: infra
        id: tf_outputs
        run: |
          BUCKET=$(terraform output -raw bucket_name)
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          API_URL=$(terraform output -raw api_gateway_url)
          COGNITO_POOL_ID=$(terraform output -raw cognito_user_pool_id)
          COGNITO_CLIENT_ID=$(terraform output -raw cognito_user_pool_client_id)
          COGNITO_DOMAIN=$(terraform output -raw cognito_domain)
          APP_URL=$(terraform output -raw cloudfront_aliases | tr -d '[]",' | awk '{print $1}')
          {
            echo "BUCKET=${BUCKET}"
            echo "DISTRIBUTION_ID=${DISTRIBUTION_ID}"
            echo "API_URL=${API_URL}"
            echo "COGNITO_POOL_ID=${COGNITO_POOL_ID}"
            echo "COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}"
            echo "COGNITO_DOMAIN=${COGNITO_DOMAIN}"
            echo "APP_URL=${APP_URL}"
          } >> "$GITHUB_OUTPUT"

  deploy_app:
    runs-on: ubuntu-latest
    needs: [changes, verify]
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Validate required role configuration
        env:
          AWS_STATE_ROLE_ARN: ${{ secrets.AWS_STATE_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$AWS_STATE_ROLE_ARN" ]; then
            echo "Missing secret: AWS_STATE_ROLE_ARN"
            exit 1
          fi
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "Missing secret: AWS_DEPLOY_ROLE_ARN"
            exit 1
          fi

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure AWS credentials for Terraform backend
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_STATE_ROLE_ARN }}
          role-session-name: gha-terraform-output-backend
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Configure AWS credentials for Terraform outputs
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-terraform-outputs
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: Read Terraform outputs
        working-directory: infra
        id: tf_outputs
        run: |
          BUCKET=$(terraform output -raw bucket_name)
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          API_URL=$(terraform output -raw api_gateway_url)
          COGNITO_POOL_ID=$(terraform output -raw cognito_user_pool_id)
          COGNITO_CLIENT_ID=$(terraform output -raw cognito_user_pool_client_id)
          COGNITO_DOMAIN=$(terraform output -raw cognito_domain)
          PRIMARY_ALIAS=$(terraform output -json cloudfront_aliases | jq -r '.[0]')
          {
            echo "BUCKET=${BUCKET}"
            echo "DISTRIBUTION_ID=${DISTRIBUTION_ID}"
            echo "API_URL=${API_URL}"
            echo "COGNITO_POOL_ID=${COGNITO_POOL_ID}"
            echo "COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}"
            echo "COGNITO_DOMAIN=${COGNITO_DOMAIN}"
            echo "PRIMARY_ALIAS=${PRIMARY_ALIAS}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials for deployment
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-app-deploy
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ steps.tf_outputs.outputs.API_URL }}
          VITE_AWS_REGION: eu-north-1
          VITE_COGNITO_USER_POOL_ID: ${{ steps.tf_outputs.outputs.COGNITO_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.tf_outputs.outputs.COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ steps.tf_outputs.outputs.COGNITO_DOMAIN }}
          VITE_COGNITO_REDIRECT_URI: https://${{ steps.tf_outputs.outputs.PRIMARY_ALIAS }}/

      - name: Deploy to S3 (hashed assets — long cache)
        env:
          BUCKET: ${{ steps.tf_outputs.outputs.BUCKET }}
        run: |
          aws s3 sync dist/ "s3://${BUCKET}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy to S3 (index.html — no cache)
        env:
          BUCKET: ${{ steps.tf_outputs.outputs.BUCKET }}
        run: |
          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.tf_outputs.outputs.DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"
